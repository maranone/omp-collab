	<link rel="stylesheet" crossorigin href="./djnv3etj.css"><script type="module" crossorigin src="./rw8cjx9a.js"></script></head>
	<body>
		<div id="root"></div>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("omp-collab-theme");
					var theme = saved === "light" || saved === "system" ? saved : "dark";
					if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
				} catch (error) {
					document.documentElement.dataset.theme = "dark";
					document.documentElement.style.colorScheme = "dark";
				}
			})();
		</script>
		
	</body>
